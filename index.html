<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>Steve 家庭記分板</title>

  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js"
  ></script>

  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;

      --text: #25313a;
      --muted: #74828e;
      --line: #dce4e9;

      --blue: #4776a8;
      --blue-light: #eaf2f8;

      --green: #218653;
      --green-light: #e8f6ee;

      --red: #c43b31;
      --red-light: #fcecea;

      --orange: #d86f12;
      --orange-light: #fff3e7;

      --shadow:
        0 10px 28px
        rgba(35, 55, 72, 0.1);
    }


    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }


    button,
    input {
      font: inherit;
    }


    button {
      touch-action: manipulation;
    }


    .app {
      width: 100%;
      max-width: 620px;
      min-height: 100vh;

      margin: 0 auto;

      padding:
        18px
        14px
        calc(
          125px +
          env(safe-area-inset-bottom)
        );
    }


    /* Header */

    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;

      margin: 2px 2px 16px;
    }


    .title-area h1 {
      margin: 0;
      color: var(--blue);
      font-size: 25px;
      font-weight: 850;
    }


    .title-area p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }


    .clear-button {
      flex: 0 0 auto;
      min-height: 34px;

      padding: 6px 11px;

      border: 1px solid var(--line);
      border-radius: 999px;

      background: #ffffff;
      color: var(--muted);

      font-size: 13px;
      font-weight: 750;

      cursor: pointer;
    }


    /* Card */

    .card {
      margin-bottom: 14px;
      padding: 18px;

      background: var(--card);

      border-radius: 20px;
      box-shadow: var(--shadow);
    }


    .card h2 {
      margin: 0 0 7px;
      font-size: 17px;
      font-weight: 800;
    }


    .note {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }


    /* Kids */

    .kids {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );

      gap: 10px;
    }


    .kid {
      position: relative;

      min-height: 84px;
      padding: 12px 7px;

      border: 2px solid var(--line);
      border-radius: 16px;

      background: #ffffff;
      color: var(--text);

      font-size: 17px;
      font-weight: 800;

      cursor: pointer;
    }


    .kid.active {
      border-color: var(--blue);
      background: var(--blue-light);
    }


    .kid.active::after {
      content: "✓";

      position: absolute;
      top: 5px;
      right: 8px;

      color: var(--blue);
      font-weight: 900;
    }


    .kid small {
      display: block;

      margin-top: 5px;

      color: var(--muted);

      font-size: 13px;
      font-weight: 600;
    }


    .kid.active small {
      color: var(--blue);
    }


    .kid-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;

      margin-top: 11px;
    }


    .soft-button {
      min-height: 42px;

      border: 1px solid var(--line);
      border-radius: 12px;

      background: #ffffff;
      color: var(--text);

      font-weight: 750;
      cursor: pointer;
    }


    /* Preset items */

    .preset-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }


    .preset-title {
      margin-bottom: 10px;
      text-align: center;
      font-weight: 850;
    }


    .preset-title.add {
      color: var(--green);
    }


    .preset-title.deduct {
      color: var(--red);
    }


    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }


    .preset-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      min-height: 50px;

      padding: 9px 11px;

      border: 2px solid transparent;
      border-radius: 14px;

      text-align: left;
      cursor: pointer;
    }


    .preset-button.add {
      background: var(--green-light);
      color: var(--green);
    }


    .preset-button.deduct {
      background: var(--red-light);
      color: var(--red);
    }


    .preset-button.active.add {
      border-color: var(--green);
    }


    .preset-button.active.deduct {
      border-color: var(--red);
    }


    .preset-label {
      flex: 1;

      font-size: 14px;
      font-weight: 750;
      line-height: 1.35;
    }


    .preset-points {
      flex: 0 0 auto;
      font-size: 17px;
      font-weight: 900;
    }


    /* Custom items */

    .field-label {
      display: block;

      margin: 0 0 6px;

      color: var(--muted);

      font-size: 13px;
      font-weight: 700;
    }


    .text-input,
    .number-input {
      width: 100%;
      min-height: 46px;

      padding: 10px 12px;

      border: 1px solid var(--line);
      border-radius: 13px;

      outline: none;

      background: #ffffff;
      color: var(--text);
    }


    .custom-row {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        125px;

      gap: 10px;
      align-items: end;
    }


    .add-custom-button {
      width: 100%;
      min-height: 46px;

      margin-top: 11px;

      border: 0;
      border-radius: 13px;

      background: var(--blue);
      color: #ffffff;

      font-weight: 800;
      cursor: pointer;
    }


    .custom-items {
      display: flex;
      flex-direction: column;
      gap: 8px;

      margin-top: 14px;
    }


    .custom-item {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        auto
        32px;

      gap: 8px;
      align-items: center;

      padding: 10px 11px;

      border: 1px solid var(--line);
      border-radius: 13px;

      background: #ffffff;
    }


    .custom-item-label {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 700;
    }


    .custom-item-points {
      font-weight: 900;
    }


    .custom-item-points.add {
      color: var(--green);
    }


    .custom-item-points.deduct {
      color: var(--red);
    }


    .remove-button {
      width: 32px;
      height: 32px;

      border: 0;
      border-radius: 50%;

      background: var(--red-light);
      color: var(--red);

      font-weight: 900;
      cursor: pointer;
    }


    .empty-message {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }


    /* Summary */

    .summary-kid {
      padding: 11px 0;

      border-bottom:
        1px solid
        var(--line);
    }


    .summary-kid-name {
      font-size: 16px;
      font-weight: 850;
    }


    .summary-line {
      margin-top: 5px;

      color: var(--muted);

      line-height: 1.5;
    }


    .item-summary {
      display: flex;
      justify-content: space-between;
      gap: 10px;

      padding: 7px 0;

      border-bottom:
        1px dashed
        var(--line);

      font-size: 14px;
    }


    .net-total {
      margin-top: 13px;
      padding: 12px;

      border-radius: 13px;

      background: var(--blue-light);

      text-align: center;

      font-size: 18px;
      font-weight: 900;
    }


    /* Bottom */

    .bottom {
      position: fixed;
      z-index: 20;

      left: 50%;
      bottom: 0;

      width: 100%;
      max-width: 620px;

      padding:
        12px
        14px
        calc(
          12px +
          env(safe-area-inset-bottom)
        );

      transform: translateX(-50%);

      border-top:
        1px solid
        var(--line);

      background:
        rgba(
          255,
          255,
          255,
          0.97
        );
    }


    .submit-button {
      width: 100%;
      min-height: 54px;

      border: 0;
      border-radius: 16px;

      background: var(--blue);
      color: #ffffff;

      font-size: 18px;
      font-weight: 850;

      cursor: pointer;
    }


    .submit-button:disabled {
      background: #b8c2ca;
      cursor: not-allowed;
    }


    .status {
      display: none;

      margin-bottom: 9px;
      padding: 10px 12px;

      border-radius: 12px;

      font-size: 14px;
      line-height: 1.5;
    }


    .status.show {
      display: block;
    }


    .status.ok {
      background: var(--green-light);
      color: #17643e;
    }


    .status.err {
      background: var(--red-light);
      color: #8f2b24;
    }


    /* Loading */

    .loading {
      display: flex;

      position: fixed;
      z-index: 99;
      inset: 0;

      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        rgba(
          244,
          246,
          248,
          0.96
        );
    }


    .loading.hide {
      display: none;
    }


    .loading-box {
      width: 100%;
      max-width: 310px;

      padding: 25px;

      border-radius: 18px;

      background: #ffffff;
      box-shadow: var(--shadow);

      text-align: center;
    }


    .spinner {
      width: 38px;
      height: 38px;

      margin: 0 auto 13px;

      border:
        4px solid
        #dfe7ed;

      border-top-color:
        var(--blue);

      border-radius: 50%;

      animation:
        spin 0.8s linear
        infinite;
    }


    @keyframes spin {
      to {
        transform:
          rotate(360deg);
      }
    }


    @media (
      max-width: 420px
    ) {
      .preset-columns {
        grid-template-columns: 1fr;
      }


      .custom-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>


<body>

  <div
    id="loading"
    class="loading"
  >
    <div class="loading-box">

      <div class="spinner"></div>

      <div id="loadingText">
        正在開啟 Steve…
      </div>

    </div>
  </div>


  <main class="app">

    <header class="top">

      <div class="title-area">

        <h1>
          ⭐ Steve 家庭記分板
        </h1>

        <p id="hello">
          正在取得 LINE 使用者資料…
        </p>

      </div>


      <button
        id="clearAllButton"
        type="button"
        class="clear-button"
      >
        清除
      </button>

    </header>


    <section class="card">

      <h2>
        1. 選擇記分對象
      </h2>

      <p class="note">
        可複選；所有選取的孩子會套用相同事項。
      </p>


      <div
        id="kids"
        class="kids"
      ></div>


      <div class="kid-tools">

        <button
          id="selectAllKids"
          type="button"
          class="soft-button"
        >
          ✅ 全選
        </button>


        <button
          id="clearKids"
          type="button"
          class="soft-button"
        >
          清除孩子
        </button>

      </div>

    </section>


    <section class="card">

      <h2>
        2. 選擇常用事項
      </h2>

      <p class="note">
        加分與扣分事項都可以複選，系統會自動計算淨分數。
      </p>


      <div class="preset-columns">

        <div>

          <div class="preset-title add">
            🟢 加分事項
          </div>

          <div
            id="addPresetList"
            class="preset-list"
          ></div>

        </div>


        <div>

          <div class="preset-title deduct">
            🔴 扣分事項
          </div>

          <div
            id="deductPresetList"
            class="preset-list"
          ></div>

        </div>

      </div>

    </section>


    <section class="card">

      <h2>
        3. 其他事項
      </h2>

      <p class="note">
        可加入多項；分數可輸入正數或負數，例如 3 或 -2。
      </p>


      <div class="custom-row">

        <div>

          <label
            for="customReason"
            class="field-label"
          >
            事項（選填）
          </label>

          <input
            id="customReason"
            class="text-input"
            type="text"
            maxlength="100"
            placeholder="例如：考試考 100 分"
          >

        </div>


        <div>

          <label
            for="customPoints"
            class="field-label"
          >
            分數
          </label>

          <input
            id="customPoints"
            class="number-input"
            type="number"
            inputmode="decimal"
            step="0.5"
            placeholder="3 或 -2"
          >

        </div>

      </div>


      <button
        id="addCustomItem"
        type="button"
        class="add-custom-button"
      >
        ＋ 加入下一項
      </button>


      <div
        id="customItems"
        class="custom-items"
      ></div>

    </section>


    <section class="card">

      <h2>
        4. 條列總結確認
      </h2>


      <div id="kidSummary"></div>


      <div
        id="itemSummary"
        style="margin-top: 14px;"
      ></div>


      <div
        id="netTotal"
        class="net-total"
      >
        本次每人淨變動：0 點
      </div>

    </section>

  </main>


  <div class="bottom">

    <div
      id="status"
      class="status"
    ></div>


    <button
      id="submitButton"
      type="button"
      class="submit-button"
      disabled
    >
      請選擇孩子與事項
    </button>

  </div>


  <script>

    /* =====================================================
     * 必填設定
     * ===================================================== */

    const LIFF_ID =
      '2012803265-4Dk496nU';


    const GAS_API_URL =
      'https://script.google.com/macros/s/AKfycbzL8LqnQ1jrwOhfKVpkOZn4k3aaxuneSOb5NuS1SShlGihmD8ofkxAoVKitrsfIXhGH/exec';


    /* =====================================================
     * State
     * ===================================================== */

    const state = {
      profile: null,
      idToken: '',

      kids: [],
      totals: {},
      presetItems: [],

      selectedKids: [],
      selectedPresetIds: [],
      customItems: [],

      submitting: false
    };


    const $ =
      function (id) {
        return document
          .getElementById(id);
      };


    /* =====================================================
     * 啟動
     * ===================================================== */

    document.addEventListener(
      'DOMContentLoaded',
      start
    );


    async function start() {
      try {
        validateFrontendConfig();

        setLoadingText(
          '正在初始化 LIFF…'
        );

        await liff.init({
          liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        setLoadingText(
          '正在取得 LINE 使用者資料…'
        );

        state.idToken =
          liff.getIDToken() ||
          '';

        state.profile =
          await liff.getProfile();

        $('hello').textContent =
          state.profile.displayName +
          '，請選擇孩子與本次事項';

        setLoadingText(
          '正在讀取目前積分…'
        );

        const data =
          await jsonp(
            'initial',
            {}
          );

        if (!data.success) {
          throw new Error(
            data.error ||
            '無法讀取初始資料'
          );
        }

        state.kids =
          data.kids || [];

        state.totals =
          data.totals || {};

        state.presetItems =
          data.presetItems || [];

        renderAll();

        hideLoading();

      } catch (error) {
        hideLoading();

        showStatus(
          '啟動失敗：' +
          getErrorMessage(error),
          'err'
        );
      }
    }


    /* =====================================================
     * 設定檢查
     * ===================================================== */

    function validateFrontendConfig() {
      if (
        !LIFF_ID ||
        LIFF_ID ===
          'YOUR_LIFF_ID'
      ) {
        throw new Error(
          '尚未設定 LIFF_ID。'
        );
      }

      if (
        !GAS_API_URL ||
        GAS_API_URL ===
          'YOUR_GAS_EXEC_URL'
      ) {
        throw new Error(
          '尚未設定 GAS_API_URL。'
        );
      }

      if (
        !GAS_API_URL.endsWith(
          '/exec'
        )
      ) {
        throw new Error(
          'GAS_API_URL 必須使用正式 /exec 網址。'
        );
      }
    }


    /* =====================================================
     * Render
     * ===================================================== */

    function renderAll() {
      renderKids();
      renderPresetItems();
      renderCustomItems();
      renderSummary();
    }


    /* =====================================================
     * 孩子
     * ===================================================== */

    function renderKids() {
      const container =
        $('kids');

      container.innerHTML = '';

      state.kids.forEach(
        function (kidName) {
          const selected =
            state.selectedKids
              .indexOf(kidName) !== -1;

          const button =
            document.createElement(
              'button'
            );

          button.type = 'button';

          button.className =
            'kid' +
            (
              selected
                ? ' active'
                : ''
            );

          button.innerHTML =
            escapeHtml(kidName) +
            '<small>' +
            formatNumber(
              state.totals[kidName] ||
              0
            ) +
            ' 點</small>';

          button.addEventListener(
            'click',
            function () {
              toggleKid(kidName);
            }
          );

          container.appendChild(
            button
          );
        }
      );
    }


    function toggleKid(kidName) {
      const index =
        state.selectedKids
          .indexOf(kidName);

      if (index === -1) {
        state.selectedKids.push(
          kidName
        );

      } else {
        state.selectedKids.splice(
          index,
          1
        );
      }

      state.selectedKids.sort(
        function (a, b) {
          return (
            state.kids.indexOf(a) -
            state.kids.indexOf(b)
          );
        }
      );

      renderKids();
      renderSummary();
    }


    /* =====================================================
     * 常用事項
     * ===================================================== */

    function renderPresetItems() {
      const addContainer =
        $('addPresetList');

      const deductContainer =
        $('deductPresetList');

      addContainer.innerHTML = '';
      deductContainer.innerHTML = '';

      state.presetItems.forEach(
        function (item) {
          const selected =
            state.selectedPresetIds
              .indexOf(item.id) !== -1;

          const button =
            document.createElement(
              'button'
            );

          button.type = 'button';

          button.className =
            'preset-button ' +
            item.type +
            (
              selected
                ? ' active'
                : ''
            );

          button.innerHTML =
            '<span class="preset-label">' +
            escapeHtml(item.label) +
            '</span>' +

            '<span class="preset-points">' +
            formatSignedPoints(
              item.points
            ) +
            '</span>';

          button.addEventListener(
            'click',
            function () {
              togglePresetItem(
                item.id
              );
            }
          );

          if (
            item.type === 'add'
          ) {
            addContainer.appendChild(
              button
            );

          } else {
            deductContainer.appendChild(
              button
            );
          }
        }
      );
    }


    function togglePresetItem(
      presetId
    ) {
      const index =
        state.selectedPresetIds
          .indexOf(presetId);

      if (index === -1) {
        state.selectedPresetIds.push(
          presetId
        );

      } else {
        state.selectedPresetIds.splice(
          index,
          1
        );
      }

      renderPresetItems();
      renderSummary();
    }


    /* =====================================================
     * 其他事項
     * ===================================================== */

    $('addCustomItem')
      .addEventListener(
        'click',
        addCustomItem
      );


    function addCustomItem() {
      clearStatus();

      let reason =
        $('customReason')
          .value
          .trim();

      const pointsText =
        $('customPoints')
          .value
          .trim();

      const points =
        Number(pointsText);

      if (
        !Number.isFinite(points) ||
        points === 0
      ) {
        showStatus(
          '其他事項請輸入有效分數，例如 3 或 -2。',
          'err'
        );

        return;
      }

      if (
        Math.abs(points) >
        1000
      ) {
        showStatus(
          '單一其他事項不可超過 1000 點。',
          'err'
        );

        return;
      }

      if (!reason) {
        reason =
          points > 0
            ? '其他加分'
            : '其他扣分';
      }

      state.customItems.push({
        localId:
          createLocalId(),

        reason: reason,

        points:
          round2(points)
      });

      $('customReason').value = '';
      $('customPoints').value = '';

      renderCustomItems();
      renderSummary();
    }


    function renderCustomItems() {
      const container =
        $('customItems');

      container.innerHTML = '';

      if (
        state.customItems.length ===
        0
      ) {
        container.innerHTML =
          '<div class="empty-message">' +
          '尚未加入其他事項' +
          '</div>';

        return;
      }

      state.customItems.forEach(
        function (item) {
          const row =
            document.createElement(
              'div'
            );

          row.className =
            'custom-item';

          row.innerHTML =
            '<div class="custom-item-label">' +
            escapeHtml(item.reason) +
            '</div>' +

            '<div class="custom-item-points ' +
            (
              item.points > 0
                ? 'add'
                : 'deduct'
            ) +
            '">' +
            formatSignedPoints(
              item.points
            ) +
            '</div>';

          const removeButton =
            document.createElement(
              'button'
            );

          removeButton.type =
            'button';

          removeButton.className =
            'remove-button';

          removeButton.textContent =
            '×';

          removeButton.addEventListener(
            'click',
            function () {
              removeCustomItem(
                item.localId
              );
            }
          );

          row.appendChild(
            removeButton
          );

          container.appendChild(
            row
          );
        }
      );
    }


    function removeCustomItem(
      localId
    ) {
      state.customItems =
        state.customItems.filter(
          function (item) {
            return (
              item.localId !==
              localId
            );
          }
        );

      renderCustomItems();
      renderSummary();
    }


    /* =====================================================
     * 摘要
     * ===================================================== */

    function getSelectedItems() {
      const presetItems =
        state.presetItems
          .filter(
            function (item) {
              return (
                state
                  .selectedPresetIds
                  .indexOf(
                    item.id
                  ) !== -1
              );
            }
          )
          .map(
            function (item) {
              return {
                label: item.label,
                points: item.points,
                type: 'preset'
              };
            }
          );

      const customItems =
        state.customItems.map(
          function (item) {
            return {
              label: item.reason,
              points: item.points,
              type: 'custom'
            };
          }
        );

      return [
        ...presetItems,
        ...customItems
      ];
    }


    function calculateTotalDelta() {
      return round2(
        getSelectedItems()
          .reduce(
            function (
              total,
              item
            ) {
              return (
                total +
                Number(
                  item.points
                )
              );
            },
            0
          )
      );
    }


    function renderSummary() {
      renderKidSummary();
      renderItemSummary();
      renderSubmitButton();
    }


    function renderKidSummary() {
      const container =
        $('kidSummary');

      container.innerHTML = '';

      const delta =
        calculateTotalDelta();

      if (
        state.selectedKids.length ===
        0
      ) {
        container.innerHTML =
          '<div class="empty-message">' +
          '請先選擇至少一位孩子' +
          '</div>';

        return;
      }

      state.selectedKids.forEach(
        function (kidName) {
          const oldTotal =
            Number(
              state.totals[kidName] ||
              0
            );

          const newTotal =
            round2(
              oldTotal +
              delta
            );

          let actionText;

          if (delta > 0) {
            actionText =
              '本次共加 ' +
              formatNumber(delta) +
              ' 點';

          } else if (delta < 0) {
            actionText =
              '本次共扣 ' +
              formatNumber(
                Math.abs(delta)
              ) +
              ' 點';

          } else {
            actionText =
              '本次淨變動 0 點';
          }

          const block =
            document.createElement(
              'div'
            );

          block.className =
            'summary-kid';

          block.innerHTML =
            '<div class="summary-kid-name">' +
            escapeHtml(kidName) +
            '</div>' +

            '<div class="summary-line">' +
            escapeHtml(actionText) +
            '</div>' +

            '<div class="summary-line">' +
            '目前 ' +
            formatNumber(oldTotal) +
            ' 點 → 完成後 ' +
            formatNumber(newTotal) +
            ' 點' +
            '</div>';

          container.appendChild(
            block
          );
        }
      );
    }


    function renderItemSummary() {
      const container =
        $('itemSummary');

      const items =
        getSelectedItems();

      container.innerHTML = '';

      if (
        items.length === 0
      ) {
        container.innerHTML =
          '<div class="empty-message">' +
          '尚未選擇或加入任何事項' +
          '</div>';

      } else {
        items.forEach(
          function (item) {
            const row =
              document.createElement(
                'div'
              );

            row.className =
              'item-summary';

            row.innerHTML =
              '<span>' +
              escapeHtml(
                item.label
              ) +
              '</span>' +

              '<strong style="color:' +
              (
                item.points > 0
                  ? 'var(--green)'
                  : 'var(--red)'
              ) +
              '">' +
              formatSignedPoints(
                item.points
              ) +
              '</strong>';

            container.appendChild(
              row
            );
          }
        );
      }

      const delta =
        calculateTotalDelta();

      $('netTotal').textContent =
        '本次每人淨變動：' +
        formatSignedPoints(delta) +
        ' 點';
    }


    function renderSubmitButton() {
      const valid =
        validateSelection();

      $('submitButton').disabled =
        !valid ||
        state.submitting;

      if (state.submitting) {
        $('submitButton').textContent =
          '正在送出…';

      } else if (valid) {
        $('submitButton').textContent =
          '確認送出';

      } else {
        $('submitButton').textContent =
          '請選擇孩子與事項';
      }
    }


    function validateSelection() {
      const hasKids =
        state.selectedKids.length >
        0;

      const hasItems =
        state.selectedPresetIds.length >
        0 ||
        state.customItems.length >
        0;

      return (
        hasKids &&
        hasItems
      );
    }


    /* =====================================================
     * 清除
     * ===================================================== */

    $('clearAllButton')
      .addEventListener(
        'click',
        clearCurrentSelection
      );


    $('selectAllKids')
      .addEventListener(
        'click',
        function () {
          state.selectedKids =
            state.kids.slice();

          renderKids();
          renderSummary();
        }
      );


    $('clearKids')
      .addEventListener(
        'click',
        function () {
          state.selectedKids = [];

          renderKids();
          renderSummary();
        }
      );


    function clearCurrentSelection() {
      state.selectedKids = [];
      state.selectedPresetIds = [];
      state.customItems = [];

      $('customReason').value = '';
      $('customPoints').value = '';

      clearStatus();
      renderAll();
    }


    /* =====================================================
     * 送出
     * ===================================================== */

    $('submitButton')
      .addEventListener(
        'click',
        submitScore
      );


    async function submitScore() {
      if (
        state.submitting ||
        !validateSelection()
      ) {
        return;
      }

      if (!state.idToken) {
        showStatus(
          '未取得 LINE ID Token，請從 LINE 重新開啟記分板。',
          'err'
        );

        return;
      }

      state.submitting = true;

      clearStatus();
      renderSubmitButton();

      const requestId =
        createRequestId();

      const customItemsForServer =
        state.customItems.map(
          function (item) {
            return {
              reason: item.reason,
              points: item.points
            };
          }
        );

      const body =
        new URLSearchParams({
          action:
            'submitLiffScore',

          requestId:
            requestId,

          idToken:
            state.idToken,

          kids:
            JSON.stringify(
              state.selectedKids
            ),

          presetIds:
            JSON.stringify(
              state.selectedPresetIds
            ),

          customItems:
            JSON.stringify(
              customItemsForServer
            )
        });

      try {
        await fetch(
          GAS_API_URL,
          {
            method: 'POST',

            mode: 'no-cors',

            headers: {
              'Content-Type':
                'application/x-www-form-urlencoded;charset=UTF-8'
            },

            body:
              body.toString()
          }
        );

        const result =
          await pollRequestResult(
            requestId,
            15,
            700
          );

        if (!result.success) {
          throw new Error(
            result.error ||
            '寫入失敗'
          );
        }

        state.totals =
          result.totals ||
          state.totals;

        const resultText =
          (
            result.results ||
            []
          )
            .map(
              function (item) {
                return (
                  item.kid +
                  ' ' +
                  formatSignedPoints(
                    item.delta
                  ) +
                  '，目前 ' +
                  formatNumber(
                    item.total
                  ) +
                  ' 點'
                );
              }
            )
            .join('；');

        showStatus(
          '✅ 已完成：' +
          resultText,
          'ok'
        );

        state.selectedKids = [];
        state.selectedPresetIds = [];
        state.customItems = [];

        $('customReason').value = '';
        $('customPoints').value = '';

        renderAll();

        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });

      } catch (error) {
        showStatus(
          '送出失敗：' +
          getErrorMessage(error),
          'err'
        );

      } finally {
        state.submitting = false;
        renderSubmitButton();
      }
    }


    /* =====================================================
     * 輪詢結果
     * ===================================================== */

    async function pollRequestResult(
      requestId,
      maxTimes,
      delay
    ) {
      for (
        let i = 0;
        i < maxTimes;
        i++
      ) {
        await wait(delay);

        const result =
          await jsonp(
            'status',
            {
              requestId:
                requestId
            }
          );

        if (
          result.status === 'done' ||
          result.status === 'error'
        ) {
          return result;
        }
      }

      throw new Error(
        '後端逾時，請查看試算表確認是否已寫入。'
      );
    }


    /* =====================================================
     * JSONP
     * ===================================================== */

    function jsonp(
      action,
      parameters
    ) {
      return new Promise(
        function (
          resolve,
          reject
        ) {
          const callbackName =
            'steve_' +
            Date.now() +
            '_' +
            Math.random()
              .toString(36)
              .slice(2);

          const script =
            document.createElement(
              'script'
            );

          const query =
            new URLSearchParams({
              action: action,
              callback: callbackName,
              ...parameters
            });

          const timeout =
            setTimeout(
              function () {
                finish(
                  new Error(
                    '讀取 GAS Backend 逾時'
                  )
                );
              },
              12000
            );

          function finish(
            error,
            data
          ) {
            clearTimeout(timeout);

            delete window[
              callbackName
            ];

            script.remove();

            if (error) {
              reject(error);

            } else {
              resolve(data);
            }
          }

          window[
            callbackName
          ] = function (data) {
            finish(
              null,
              data
            );
          };

          script.onerror =
            function () {
              finish(
                new Error(
                  '無法連線 GAS Backend'
                )
              );
            };

          script.src =
            GAS_API_URL +
            '?' +
            query.toString();

          document.body.appendChild(
            script
          );
        }
      );
    }


    /* =====================================================
     * 工具
     * ===================================================== */

    function createRequestId() {
      const bytes =
        new Uint8Array(24);

      crypto.getRandomValues(
        bytes
      );

      return Array
        .from(
          bytes,
          function (value) {
            return value
              .toString(16)
              .padStart(
                2,
                '0'
              );
          }
        )
        .join('');
    }


    function createLocalId() {
      return (
        Date.now()
          .toString(36) +
        '_' +
        Math.random()
          .toString(36)
          .slice(2)
      );
    }


    function wait(
      milliseconds
    ) {
      return new Promise(
        function (resolve) {
          setTimeout(
            resolve,
            milliseconds
          );
        }
      );
    }


    function setLoadingText(
      text
    ) {
      $('loadingText').textContent =
        text;
    }


    function hideLoading() {
      $('loading')
        .classList
        .add('hide');
    }


    function showStatus(
      text,
      type
    ) {
      $('status').textContent =
        text;

      $('status').className =
        'status show ' +
        type;
    }


    function clearStatus() {
      $('status').className =
        'status';

      $('status').textContent =
        '';
    }


    function getErrorMessage(
      error
    ) {
      return (
        error &&
        error.message
          ? error.message
          : String(error)
      );
    }


    function formatSignedPoints(
      value
    ) {
      const number =
        Number(value);

      return (
        number > 0
          ? '+' +
            formatNumber(number)
          : formatNumber(number)
      );
    }


    function formatNumber(
      value
    ) {
      const number =
        Number(value);

      if (
        !Number.isFinite(number)
      ) {
        return '0';
      }

      if (
        Number.isInteger(number)
      ) {
        return String(number);
      }

      return number
        .toFixed(2)
        .replace(/0+$/, '')
        .replace(/\.$/, '');
    }


    function round2(
      number
    ) {
      return (
        Math.round(
          Number(number) *
          100
        ) / 100
      );
    }


    function escapeHtml(
      value
    ) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

  </script>
