  <script>

    /* =====================================================
     * 1. 必填設定
     *
     * 請改成你的實際值。
     * ===================================================== */

    const LIFF_ID =
      '2012803265-4Dk496nU';


    const GAS_API_URL =
      'https://script.google.com/macros/s/AKfycbzL8LqnQ1jrwOhfKVpkOZn4k3aaxuneSOb5NuS1SShlGihmD8ofkxAoVKitrsfIXhGH/exec';


    /* =====================================================
     * 2. App State
     * ===================================================== */

    const state = {

      profile:
        null,

      idToken:
        '',

      kids:
        [],

      totals:
        {},

      addReasons:
        [],

      deductReasons:
        [],

      selectedKids:
        [],

      points:
        0,

      reason:
        '',

      submitting:
        false
    };


    const SCORE_VALUES = [
      1,
      2,
      3,
      5
    ];


    /* =====================================================
     * 3. DOM
     * ===================================================== */

    const $ =
      function (
        id
      ) {

        return document
          .getElementById(
            id
          );

      };


    /* =====================================================
     * 4. 啟動
     * ===================================================== */

    document.addEventListener(
      'DOMContentLoaded',
      start
    );


    async function start() {

      try {

        validateFrontendConfig();


        setLoadingText(
          '正在初始化 LIFF…'
        );


        await liff.init({
          liffId:
            LIFF_ID
        });


        if (
          !liff.isLoggedIn()
        ) {

          liff.login();

          return;
        }


        setLoadingText(
          '正在取得 LINE 使用者資料…'
        );


        state.idToken =
          liff.getIDToken() ||
          '';


        state.profile =
          await liff.getProfile();


        $('hello')
          .textContent =
            state.profile
              .displayName +
            '，請選擇孩子、分數與事由';


        setLoadingText(
          '正在讀取目前積分…'
        );


        const data =
          await jsonp(
            'initial',
            {}
          );


        if (
          !data.success
        ) {

          throw new Error(
            data.error ||
            '無法讀取初始資料'
          );

        }


        state.kids =
          data.kids ||
          [];


        state.totals =
          data.totals ||
          {};


        state.addReasons =
          data.addReasons ||
          [];


        state.deductReasons =
          data.deductReasons ||
          [];


        render();


        hideLoading();


      } catch (error) {

        hideLoading();


        showStatus(
          '啟動失敗：' +
          getErrorMessage(
            error
          ),
          'err'
        );

      }

    }


    /* =====================================================
     * 5. 設定檢查
     * ===================================================== */

    function validateFrontendConfig() {

      if (
        !LIFF_ID ||
        LIFF_ID ===
          'YOUR_LIFF_ID'
      ) {

        throw new Error(
          '請先在 index.html 填入正確的 LIFF_ID。'
        );

      }


      if (
        !GAS_API_URL ||
        GAS_API_URL ===
          'YOUR_GAS_EXEC_URL'
      ) {

        throw new Error(
          '請先在 index.html 填入正確的 GAS_API_URL。'
        );

      }


      if (
        !GAS_API_URL.endsWith(
          '/exec'
        )
      ) {

        throw new Error(
          'GAS_API_URL 必須使用正式 /exec 網址。'
        );

      }

    }


    /* =====================================================
     * 6. Render
     * ===================================================== */

    function render() {

      renderKids();

      renderScores();

      renderReasons();

      renderPreview();

    }


    /* =====================================================
     * 7. 孩子
     * ===================================================== */

    function renderKids() {

      const container =
        $('kids');


      container.innerHTML =
        '';


      state.kids.forEach(
        function (
          kidName
        ) {

          const button =
            document.createElement(
              'button'
            );


          button.type =
            'button';


          const selected =
            state.selectedKids
              .indexOf(
                kidName
              ) !== -1;


          button.className =
            'kid' +
            (
              selected
                ? ' active'
                : ''
            );


          button.innerHTML =
            escapeHtml(
              kidName
            ) +

            '<small>' +

            formatNumber(
              state.totals[
                kidName
              ] || 0
            ) +

            ' 分</small>';


          button.addEventListener(
            'click',
            function () {

              toggleKid(
                kidName
              );

            }
          );


          container.appendChild(
            button
          );

        }
      );

    }


    function toggleKid(
      kidName
    ) {

      const index =
        state.selectedKids
          .indexOf(
            kidName
          );


      if (
        index === -1
      ) {

        state.selectedKids
          .push(
            kidName
          );

      } else {

        state.selectedKids
          .splice(
            index,
            1
          );

      }


      /*
       * 維持 KIDS 順序
       */

      state.selectedKids.sort(
        function (
          a,
          b
        ) {

          return (
            state.kids
              .indexOf(a) -

            state.kids
              .indexOf(b)
          );

        }
      );


      renderKids();

      renderPreview();

    }


    /* =====================================================
     * 8. 分數
     * ===================================================== */

    function renderScores() {

      const container =
        $('scores');


      container.innerHTML =
        '';


      SCORE_VALUES.forEach(
        function (
          value
        ) {

          appendScoreButton(
            value,
            container
          );


          appendScoreButton(
            -value,
            container
          );

        }
      );

    }


    function appendScoreButton(
      value,
      container
    ) {

      const button =
        document.createElement(
          'button'
        );


      button.type =
        'button';


      button.className =
        'score ' +

        (
          value > 0
            ? 'plus'
            : 'minus'
        ) +

        (
          state.points ===
          value

            ? ' active'

            : ''
        );


      button.textContent =
        value > 0
          ? '+' +
            value

          : String(
              value
            );


      button.addEventListener(
        'click',
        function () {

          state.points =
            value;


          renderScores();

          renderReasons();

          renderPreview();

        }
      );


      container.appendChild(
        button
      );

    }


    /* =====================================================
     * 9. 事由
     * ===================================================== */

    function renderReasons() {

      const container =
        $('reasons');


      container.innerHTML =
        '';


      /*
       * 若選減分，減分原因放前面。
       * 若選加分，加分原因放前面。
       */

      const primaryReasons =
        state.points < 0
          ? state.deductReasons
          : state.addReasons;


      const secondaryReasons =
        state.points < 0
          ? state.addReasons
          : state.deductReasons;


      const allReasons = [
        ...primaryReasons,
        ...secondaryReasons
      ];


      const usedLabels =
        new Set();


      allReasons.forEach(
        function (
          item
        ) {

          if (
            usedLabels.has(
              item.label
            )
          ) {

            return;

          }


          usedLabels.add(
            item.label
          );


          const button =
            document.createElement(
              'button'
            );


          button.type =
            'button';


          button.className =
            'reason' +

            (
              state.reason ===
              item.label

                ? ' active'

                : ''
            );


          button.textContent =
            item.label;


          button.addEventListener(
            'click',
            function () {

              state.reason =
                item.label;


              $('custom')
                .value =
                '';


              renderReasons();

              renderPreview();

            }
          );


          container.appendChild(
            button
          );

        }
      );

    }


    /* =====================================================
     * 10. 全選與清除
     * ===================================================== */

    $('all').addEventListener(
      'click',
      function () {

        state.selectedKids =
          state.kids.slice();


        renderKids();

        renderPreview();

      }
    );


    $('clear').addEventListener(
      'click',
      function () {

        state.selectedKids =
          [];


        renderKids();

        renderPreview();

      }
    );


    /* =====================================================
     * 11. 自訂事由
     * ===================================================== */

    $('custom').addEventListener(
      'input',
      function (
        event
      ) {

        state.reason =
          event.target
            .value
            .trim();


        renderReasons();

        renderPreview();

      }
    );


    /* =====================================================
     * 12. 預覽
     * ===================================================== */

    function renderPreview() {

      const valid =
        validateSelection();


      const preview =
        $('preview');


      preview.className =
        'card preview' +

        (
          state.points > 0

            ? ' plus-border'

            : state.points < 0

              ? ' minus-border'

              : ''
        );


      const kidsText =
        state.selectedKids.length
          ? state.selectedKids
              .join('、')

          : '尚未選擇';


      const pointsText =
        state.points

          ? (
              state.points > 0
                ? '+'
                : ''
            ) +
            formatNumber(
              state.points
            )

          : '尚未選擇';


      const reasonText =
        state.reason ||
        '尚未選擇';


      $('previewText')
        .innerHTML =
          '<div class="preview-line">' +

          '<strong>' +
          escapeHtml(
            kidsText
          ) +
          '</strong>' +

          '</div>' +

          '<div class="preview-line">' +

          '每人：' +
          escapeHtml(
            pointsText
          ) +
          ' 分' +

          '</div>' +

          '<div class="preview-line">' +

          '事由：' +
          escapeHtml(
            reasonText
          ) +

          '</div>';


      $('submit')
        .disabled =
          !valid ||
          state.submitting;


      if (
        state.submitting
      ) {

        $('submit')
          .textContent =
            '正在送出…';

      } else if (
        valid
      ) {

        $('submit')
          .textContent =
            '確認送出 ' +
            pointsText +
            ' 分';

      } else {

        $('submit')
          .textContent =
            '請完成選擇';

      }

    }


    function validateSelection() {

      return Boolean(

        state.selectedKids
          .length > 0 &&

        Number.isFinite(
          state.points
        ) &&

        state.points !== 0 &&

        String(
          state.reason ||
          ''
        )
          .trim()

      );

    }


    /* =====================================================
     * 13. 送出
     * ===================================================== */

    $('submit').addEventListener(
      'click',
      submitScore
    );


    async function submitScore() {

      if (
        state.submitting ||
        !validateSelection()
      ) {

        return;

      }


      if (
        !state.idToken
      ) {

        showStatus(
          '沒有取得 LINE ID Token，請從 LINE 重新開啟記分板。',
          'err'
        );

        return;

      }


      state.submitting =
        true;


      clearStatus();

      renderPreview();


      const requestId =
        createRequestId();


      const body =
        new URLSearchParams({

          action:
            'submitLiffScore',

          requestId:
            requestId,

          idToken:
            state.idToken,

          kids:
            JSON.stringify(
              state.selectedKids
            ),

          points:
            String(
              state.points
            ),

          reason:
            state.reason
        });


      try {

        /*
         * GAS ContentService 會重新導向至
         * script.googleusercontent.com。
         *
         * 不直接讀取 POST 回應，
         * 寫入結果改用 requestId 查詢。
         */

        await fetch(
          GAS_API_URL,
          {
            method:
              'POST',

            mode:
              'no-cors',

            headers: {
              'Content-Type':
                'application/x-www-form-urlencoded;charset=UTF-8'
            },

            body:
              body.toString()
          }
        );


        const result =
          await pollRequestResult(
            requestId,
            12,
            700
          );


        if (
          !result.success
        ) {

          throw new Error(
            result.error ||
            '寫入失敗'
          );

        }


        state.totals =
          result.totals ||
          state.totals;


        const resultText =
          (
            result.results ||
            []
          )
            .map(
              function (
                item
              ) {

                return (

                  item.kid +
                  ' ' +

                  (
                    item.delta > 0
                      ? '+'
                      : ''
                  ) +

                  formatNumber(
                    item.delta
                  ) +

                  '，目前 ' +

                  formatNumber(
                    item.total
                  ) +

                  ' 分'

                );

              }
            )
            .join(
              '；'
            );


        showStatus(
          '✅ 已完成：' +
          resultText,
          'ok'
        );


        /*
         * 保留孩子選取，
         * 方便連續記分。
         */

        state.points =
          0;


        state.reason =
          '';


        $('custom')
          .value =
          '';


        render();


        window.scrollTo({
          top:
            0,

          behavior:
            'smooth'
        });


      } catch (error) {

        showStatus(
          '送出失敗：' +
          getErrorMessage(
            error
          ),
          'err'
        );


      } finally {

        state.submitting =
          false;


        renderPreview();

      }

    }


    /* =====================================================
     * 14. 輪詢結果
     * ===================================================== */

    async function pollRequestResult(
      requestId,
      maxTimes,
      delay
    ) {

      for (
        let i = 0;
        i < maxTimes;
        i++
      ) {

        await wait(
          delay
        );


        const result =
          await jsonp(
            'status',
            {
              requestId:
                requestId
            }
          );


        if (
          result.status ===
            'done' ||

          result.status ===
            'error'
        ) {

          return result;

        }

      }


      throw new Error(
        '後端逾時，請查看試算表確認是否已寫入。'
      );

    }


    /* =====================================================
     * 15. JSONP
     * ===================================================== */

    function jsonp(
      action,
      params
    ) {

      return new Promise(
        function (
          resolve,
          reject
        ) {

          const callbackName =
            'steve_' +
            Date.now() +
            '_' +
            Math.random()
              .toString(36)
              .slice(2);


          const script =
            document.createElement(
              'script'
            );


          const query =
            new URLSearchParams({
              action:
                action,

              callback:
                callbackName,

              ...params
            });


          const timer =
            setTimeout(
              function () {

                finish(
                  new Error(
                    '讀取 GAS Backend 逾時'
                  )
                );

              },

              12000
            );


          function finish(
            error,
            data
          ) {

            clearTimeout(
              timer
            );


            delete window[
              callbackName
            ];


            script.remove();


            if (error) {

              reject(
                error
              );

            } else {

              resolve(
                data
              );

            }

          }


          window[
            callbackName
          ] = function (
            data
          ) {

            finish(
              null,
              data
            );

          };


          script.onerror =
            function () {

              finish(
                new Error(
                  '無法連線 GAS Backend'
                )
              );

            };


          script.src =
            GAS_API_URL +
            '?' +
            query.toString();


          document.body
            .appendChild(
              script
            );

        }
      );

    }


    /* =====================================================
     * 16. Request ID
     * ===================================================== */

    function createRequestId() {

      const bytes =
        new Uint8Array(
          24
        );


      crypto.getRandomValues(
        bytes
      );


      return Array
        .from(
          bytes,

          function (
            value
          ) {

            return value
              .toString(16)
              .padStart(
                2,
                '0'
              );

          }
        )
        .join('');

    }


    /* =====================================================
     * 17. 共用工具
     * ===================================================== */

    function wait(
      milliseconds
    ) {

      return new Promise(
        function (
          resolve
        ) {

          setTimeout(
            resolve,
            milliseconds
          );

        }
      );

    }


    function setLoadingText(
      text
    ) {

      $('loadingText')
        .textContent =
          text;

    }


    function hideLoading() {

      $('loading')
        .classList
        .add(
          'hide'
        );

    }


    function showStatus(
      text,
      type
    ) {

      $('status')
        .textContent =
          text;


      $('status')
        .className =
          'status show ' +
          type;

    }


    function clearStatus() {

      $('status')
        .className =
          'status';


      $('status')
        .textContent =
          '';

    }


    function getErrorMessage(
      error
    ) {

      if (
        error &&
        error.message
      ) {

        return error.message;

      }


      return String(
        error
      );

    }


    function formatNumber(
      value
    ) {

      const number =
        Number(
          value
        );


      if (
        !Number.isFinite(
          number
        )
      ) {

        return '0';

      }


      if (
        Number.isInteger(
          number
        )
      ) {

        return String(
          number
        );

      }


      return number
        .toFixed(2)
        .replace(
          /0+$/,
          ''
        )
        .replace(
          /\.$/,
          ''
        );

    }


    function escapeHtml(
      value
    ) {

      return String(
        value
      )
        .replace(
          /&/g,
          '&amp;'
        )
        .replace(
          /</g,
          '&lt;'
        )
        .replace(
          />/g,
          '&gt;'
        )
        .replace(
          /"/g,
          '&quot;'
        )
        .replace(
          /'/g,
          '&#039;'
        );

    }

  </script>
