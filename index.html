<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Steve 家庭記分板</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--text:#25313a;--muted:#74828e;--line:#dce4e9;
  --blue:#4776a8;--blue2:#eaf2f8;
  --green:#218653;--green2:#e8f6ee;
  --red:#c43b31;--red2:#fcecea;
  --purple:#6b4fbb;--purple2:#f1ecfc;
  --shadow:0 10px 28px rgba(35,55,72,.1)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
button,input{font:inherit}button{touch-action:manipulation;cursor:pointer}
.app{max-width:680px;margin:0 auto;padding:18px 14px calc(125px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:2px 2px 16px}
.top h1{margin:0;color:var(--blue);font-size:25px;font-weight:850}
.top p{margin:6px 0 0;color:var(--muted);font-size:14px}
.clear-btn{flex:none;min-height:34px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:13px;font-weight:750}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card h2{margin:0 0 7px;font-size:17px;font-weight:800}
.note{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.5}
.kids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kid{position:relative;min-height:84px;padding:12px 7px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--text);font-size:17px;font-weight:800}
.kid small{display:block;margin-top:5px;color:var(--muted);font-size:13px;font-weight:600}
.kid.active{border-color:var(--blue);background:var(--blue2)}
.kid.active small{color:var(--blue)}
.kid.active::after{content:"✓";position:absolute;top:5px;right:8px;color:var(--blue);font-weight:900}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}
.soft{min-height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);font-weight:750}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col-title{margin-bottom:10px;text-align:center;font-weight:850}
.col-title.add{color:var(--green)}
.col-title.deduct{color:var(--red)}
.col-title.redeem{color:var(--purple)}
.list{display:flex;flex-direction:column;gap:9px}
.preset{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:50px;padding:9px 11px;border:2px solid transparent;border-radius:14px;text-align:left}
.preset.add{background:var(--green2);color:var(--green)}
.preset.deduct{background:var(--red2);color:var(--red)}
.preset.redeem{background:var(--purple2);color:var(--purple)}
.preset.add.active{border-color:var(--green)}
.preset.deduct.active{border-color:var(--red)}
.preset.redeem.active{border-color:var(--purple)}
.preset .label{flex:1;font-size:14px;font-weight:750;line-height:1.35}
.preset .pts{flex:none;font-size:17px;font-weight:900}
.field-label{display:block;margin:0 0 6px;color:var(--muted);font-size:13px;font-weight:700}
.input{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:13px;outline:none;background:#fff;color:var(--text)}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(71,118,168,.12)}
.custom-row{display:grid;grid-template-columns:minmax(0,1fr) 125px;gap:10px;align-items:end}
.add-btn{width:100%;min-height:46px;margin-top:11px;border:0;border-radius:13px;background:var(--blue);color:#fff;font-weight:800}
.custom-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.custom-item{display:grid;grid-template-columns:minmax(0,1fr) auto 32px;gap:8px;align-items:center;padding:10px 11px;border:1px solid var(--line);border-radius:13px;background:#fff}
.custom-item .name{min-width:0;overflow-wrap:anywhere;font-weight:700}
.custom-item .pts{font-weight:900}
.pts.add{color:var(--green)}.pts.deduct{color:var(--red)}.pts.redeem{color:var(--purple)}
.remove{width:32px;height:32px;border:0;border-radius:50%;background:var(--red2);color:var(--red);font-weight:900}
.empty{color:var(--muted);font-size:13px;text-align:center}
.sum-kid{padding:11px 0;border-bottom:1px solid var(--line)}
.sum-kid:last-child{border-bottom:0}
.sum-name{font-size:16px;font-weight:850}
.sum-line{margin-top:5px;color:var(--muted);line-height:1.5}
.sum-item{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.net{margin-top:13px;padding:12px;border-radius:13px;background:var(--blue2);text-align:center;font-size:18px;font-weight:900}
.bottom{position:fixed;z-index:20;left:50%;bottom:0;width:100%;max-width:680px;transform:translateX(-50%);padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(255,255,255,.97)}
.submit{width:100%;min-height:54px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-size:18px;font-weight:850}
.submit:disabled{background:#b8c2ca;cursor:not-allowed}
.status{display:none;margin-bottom:9px;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.5}
.status.show{display:block}
.status.ok{background:var(--green2);color:#17643e}
.status.err{background:var(--red2);color:#8f2b24}
.loading{position:fixed;z-index:99;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(244,246,248,.96)}
.loading.hide{display:none}
.loadbox{width:100%;max-width:310px;padding:25px;border-radius:18px;background:#fff;box-shadow:var(--shadow);text-align:center}
.spin{width:38px;height:38px;margin:0 auto 13px;border:4px solid #dfe7ed;border-top-color:var(--blue);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:600px){.cols{grid-template-columns:1fr}}
@media(max-width:420px){.custom-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loading" class="loading">
  <div class="loadbox"><div class="spin"></div><div id="loadingText">正在開啟 Steve…</div></div>
</div>

<main class="app">
  <header class="top">
    <div>
      <h1>⭐ Steve 家庭記分板</h1>
      <p id="hello">正在取得 LINE 使用者資料…</p>
    </div>
    <button id="clearAll" type="button" class="clear-btn">清除</button>
  </header>

  <section class="card">
    <h2>1. 選擇記分對象</h2>
    <p class="note">可複選；所有選取的孩子會套用相同事項。</p>
    <div id="kids" class="kids"></div>
    <div class="tools">
      <button id="selectAll" type="button" class="soft">✅ 全選</button>
      <button id="clearKids" type="button" class="soft">清除孩子</button>
    </div>
  </section>

  <section class="card">
    <h2>2. 選擇常用事項</h2>
    <p class="note">加分、扣分與兌換事項都可以複選，系統會自動計算淨分數。</p>
    <div class="cols">
      <div><div class="col-title add">🟢 加分事項</div><div id="addList" class="list"></div></div>
      <div><div class="col-title deduct">🔴 扣分事項</div><div id="deductList" class="list"></div></div>
      <div><div class="col-title redeem">🟣 兌換獎勵事項</div><div id="redeemList" class="list"></div></div>
    </div>
  </section>

  <section class="card">
    <h2>3. 其他事項</h2>
    <p class="note">可加入多項；分數可輸入正數或負數，例如 3 或 -2。</p>
    <div class="custom-row">
      <div>
        <label for="customReason" class="field-label">事項（選填）</label>
        <input id="customReason" class="input" type="text" maxlength="100" placeholder="例如：考試考 100 分">
      </div>
      <div>
        <label for="customPoints" class="field-label">分數</label>
        <input id="customPoints" class="input" type="number" inputmode="decimal" step="0.5" placeholder="3 或 -2">
      </div>
    </div>
    <button id="addCustom" type="button" class="add-btn">＋ 加入下一項</button>
    <div id="customList" class="custom-list"></div>
  </section>

  <section class="card">
    <h2>4. 條列總結確認</h2>
    <div id="kidSummary"></div>
    <div id="itemSummary" style="margin-top:14px"></div>
    <div id="net" class="net">本次每人淨變動：0 點</div>
  </section>
</main>

<div class="bottom">
  <div id="status" class="status"></div>
  <button id="submit" type="button" class="submit" disabled>請選擇孩子與事項</button>
</div>

<script>
/* ===== 必填設定 ===== */
const LIFF_ID = '2012803265-4Dk496nU';
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwHj5fstS_gg2IrYUtOwshuRj8o069gaDnfO9x2abPl7Oez47kys2NCaIBdFosJIfz7/exec';

/* ===== State ===== */
const state = {
  idToken: '',
  kids: [],
  totals: {},
  presets: [],
  selectedKids: [],
  selectedPresetIds: [],
  customItems: [],
  submitting: false
};

const $ = id => document.getElementById(id);

document.addEventListener('DOMContentLoaded', start);

async function start() {
  try {
    checkConfig();
    setLoading('正在初始化 LIFF…');
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) { liff.login(); return; }

    setLoading('正在取得 LINE 使用者資料…');
    state.idToken = liff.getIDToken() || '';
    const profile = await liff.getProfile();
    $('hello').textContent = profile.displayName + '，請選擇孩子與本次事項';

    setLoading('正在讀取目前積分…');
    const data =
      await jsonp(
        'initial',
        {
          idToken:
            state.idToken
        }
      );

    if (!data.success) throw new Error(data.error || '無法讀取初始資料');

    state.kids = data.kids || [];
    state.totals = data.totals || {};
    state.presets = data.presetItems || [];

    renderAll();
    hideLoading();
  } catch (err) {
    hideLoading();
    showStatus('啟動失敗：' + msg(err), 'err');
  }
}

function checkConfig() {
  if (!LIFF_ID || LIFF_ID.indexOf('你的') !== -1) throw new Error('尚未設定正確的 LIFF_ID。');
  if (!GAS_API_URL || GAS_API_URL.indexOf('你的部署ID') !== -1) throw new Error('尚未設定正確的 GAS_API_URL。');
  if (!GAS_API_URL.endsWith('/exec')) throw new Error('GAS_API_URL 必須使用正式 /exec 網址。');
}

/* ===== Render ===== */
function renderAll() {
  renderKids();
  renderPresets();
  renderCustom();
  renderSummary();
}

function renderKids() {
  const box = $('kids');
  box.innerHTML = '';
  state.kids.forEach(name => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'kid' + (state.selectedKids.includes(name) ? ' active' : '');
    b.innerHTML = esc(name) + '<small>' + num(state.totals[name] || 0) + ' 點</small>';
    b.onclick = () => toggleKid(name);
    box.appendChild(b);
  });
}

function toggleKid(name) {
  const i = state.selectedKids.indexOf(name);
  if (i < 0) state.selectedKids.push(name); else state.selectedKids.splice(i, 1);
  state.selectedKids.sort((a, b) => state.kids.indexOf(a) - state.kids.indexOf(b));
  renderKids();
  renderSummary();
}

function renderPresets() {
  const addBox = $('addList');
  const deductBox = $('deductList');
  const redeemBox = $('redeemList');
  addBox.innerHTML = '';
  deductBox.innerHTML = '';
  redeemBox.innerHTML = '';

  state.presets.forEach(item => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'preset ' + item.type + (state.selectedPresetIds.includes(item.id) ? ' active' : '');
    b.innerHTML = '<span class="label">' + esc(item.label) + '</span><span class="pts">' + signed(item.points) + '</span>';
    b.onclick = () => togglePreset(item.id);

    if (item.type === 'add') {
      addBox.appendChild(b);
    } else if (item.type === 'redeem') {
      redeemBox.appendChild(b);
    } else {
      deductBox.appendChild(b);
    }
  });
}

function togglePreset(id) {
  const i = state.selectedPresetIds.indexOf(id);
  if (i < 0) state.selectedPresetIds.push(id); else state.selectedPresetIds.splice(i, 1);
  renderPresets();
  renderSummary();
}

/* ===== 其他事項 ===== */
$('addCustom').onclick = addCustom;

function addCustom() {
  clearStatus();
  let reason = $('customReason').value.trim();
  const points = Number($('customPoints').value.trim());

  if (!Number.isFinite(points) || points === 0) {
    showStatus('其他事項請輸入有效分數，例如 3 或 -2。', 'err');
    return;
  }
  if (Math.abs(points) > 1000) {
    showStatus('單一其他事項不可超過 1000 點。', 'err');
    return;
  }
  if (!reason) reason = points > 0 ? '其他加分' : '其他扣分';

  state.customItems.push({ localId: localId(), reason: reason, points: round2(points) });
  $('customReason').value = '';
  $('customPoints').value = '';
  renderCustom();
  renderSummary();
}

function renderCustom() {
  const box = $('customList');
  box.innerHTML = '';

  if (!state.customItems.length) {
    box.innerHTML = '<div class="empty">尚未加入其他事項</div>';
    return;
  }

  state.customItems.forEach(item => {
    const row = document.createElement('div');
    row.className = 'custom-item';
    row.innerHTML =
      '<div class="name">' + esc(item.reason) + '</div>' +
      '<div class="pts ' + (item.points > 0 ? 'add' : 'deduct') + '">' + signed(item.points) + '</div>';

    const rm = document.createElement('button');
    rm.type = 'button';
    rm.className = 'remove';
    rm.textContent = '×';
    rm.onclick = () => {
      state.customItems = state.customItems.filter(x => x.localId !== item.localId);
      renderCustom();
      renderSummary();
    };

    row.appendChild(rm);
    box.appendChild(row);
  });
}

/* ===== 摘要 ===== */
function selectedItems() {
  const presets = state.presets
    .filter(p => state.selectedPresetIds.includes(p.id))
    .map(p => ({ label: p.label, points: p.points, type: p.type }));
  const customs = state.customItems.map(c => ({ label: c.reason, points: c.points, type: c.points > 0 ? 'add' : 'deduct' }));
  return presets.concat(customs);
}

function totalDelta() {
  return round2(selectedItems().reduce((sum, x) => sum + Number(x.points), 0));
}

function renderSummary() {
  const delta = totalDelta();
  const items = selectedItems();

  /* 孩子摘要 */
  const kidBox = $('kidSummary');
  kidBox.innerHTML = '';
  if (!state.selectedKids.length) {
    kidBox.innerHTML = '<div class="empty">請先選擇至少一位孩子</div>';
  } else {
    state.selectedKids.forEach(name => {
      const oldTotal = Number(state.totals[name] || 0);
      const newTotal = round2(oldTotal + delta);
      const action = delta > 0 ? '本次共加 ' + num(delta) + ' 點'
                   : delta < 0 ? '本次共扣 ' + num(Math.abs(delta)) + ' 點'
                   : '本次淨變動 0 點';
      const div = document.createElement('div');
      div.className = 'sum-kid';
      div.innerHTML =
        '<div class="sum-name">' + esc(name) + '</div>' +
        '<div class="sum-line">' + esc(action) + '</div>' +
        '<div class="sum-line">目前 ' + num(oldTotal) + ' 點 → 完成後 ' + num(newTotal) + ' 點</div>';
      kidBox.appendChild(div);
    });
  }

  /* 事項摘要 */
  const itemBox = $('itemSummary');
  itemBox.innerHTML = '';
  if (!items.length) {
    itemBox.innerHTML = '<div class="empty">尚未選擇或加入任何事項</div>';
  } else {
    items.forEach(x => {
      const color = x.type === 'redeem' ? 'var(--purple)'
                  : x.points > 0 ? 'var(--green)'
                  : x.points < 0 ? 'var(--red)'
                  : 'var(--muted)';
      const row = document.createElement('div');
      row.className = 'sum-item';
      row.innerHTML = '<span>' + esc(x.label) + '</span><strong style="color:' + color + '">' + signed(x.points) + '</strong>';
      itemBox.appendChild(row);
    });
  }

  $('net').textContent = '本次每人淨變動：' + signed(delta) + ' 點';

  /* 送出按鈕 */
  const valid = state.selectedKids.length > 0 && (state.selectedPresetIds.length > 0 || state.customItems.length > 0);
  $('submit').disabled = !valid || state.submitting;
  $('submit').textContent = state.submitting ? '正在送出…' : valid ? '確認送出' : '請選擇孩子與事項';
}

/* ===== 清除 ===== */
$('selectAll').onclick = () => { state.selectedKids = state.kids.slice(); renderKids(); renderSummary(); };
$('clearKids').onclick = () => { state.selectedKids = []; renderKids(); renderSummary(); };
$('clearAll').onclick = () => {
  state.selectedKids = [];
  state.selectedPresetIds = [];
  state.customItems = [];
  $('customReason').value = '';
  $('customPoints').value = '';
  clearStatus();
  renderAll();
};

/* ===== 送出 ===== */
$('submit').onclick = submitScore;

async function submitScore() {
  if (state.submitting) return;
  if (!state.selectedKids.length || (!state.selectedPresetIds.length && !state.customItems.length)) return;
  if (!state.idToken) { showStatus('未取得 LINE ID Token，請從 LINE 重新開啟記分板。', 'err'); return; }

  state.submitting = true;
  clearStatus();
  renderSummary();

  const requestId = createRequestId();
  const body = new URLSearchParams({
    action: 'submitLiffScore',
    requestId: requestId,
    idToken: state.idToken,
    kids: JSON.stringify(state.selectedKids),
    presetIds: JSON.stringify(state.selectedPresetIds),
    customItems: JSON.stringify(state.customItems.map(c => ({ reason: c.reason, points: c.points })))
  });

  try {
    await fetch(GAS_API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
      body: body.toString()
    });

    const result = await poll(requestId, 15, 700);
    if (!result.success) throw new Error(result.error || '寫入失敗');

    state.totals = result.totals || state.totals;

    const text = (result.results || [])
      .map(r => r.kid + ' ' + signed(r.delta) + '，目前 ' + num(r.total) + ' 點')
      .join('；');

    showStatus('✅ 已完成：' + text, 'ok');

    state.selectedKids = [];
    state.selectedPresetIds = [];
    state.customItems = [];
    $('customReason').value = '';
    $('customPoints').value = '';
    renderAll();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    showStatus('送出失敗：' + msg(err), 'err');
  } finally {
    state.submitting = false;
    renderSummary();
  }
}

async function poll(requestId, times, delay) {
  for (let i = 0; i < times; i++) {
    await wait(delay);
    const r = await jsonp('status', { requestId: requestId });
    if (r.status === 'done' || r.status === 'error') return r;
  }
  throw new Error('後端逾時，請查看試算表確認是否已寫入。');
}

/* ===== JSONP ===== */
function jsonp(action, params) {
  return new Promise((resolve, reject) => {
    const cb = 'steve_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const query = new URLSearchParams(Object.assign({ action: action, callback: cb }, params));

    const timer = setTimeout(() => finish(new Error('讀取 GAS Backend 逾時')), 12000);

    function finish(err, data) {
      clearTimeout(timer);
      delete window[cb];
      script.remove();
      err ? reject(err) : resolve(data);
    }

    window[cb] = data => finish(null, data);
    script.onerror = () => finish(new Error('無法連線 GAS Backend'));
    script.src = GAS_API_URL + '?' + query.toString();
    document.body.appendChild(script);
  });
}

/* ===== 工具 ===== */
function createRequestId() {
  const a = new Uint8Array(24);
  crypto.getRandomValues(a);
  return Array.from(a, v => v.toString(16).padStart(2, '0')).join('');
}
function localId() { return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2); }
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
function setLoading(t) { $('loadingText').textContent = t; }
function hideLoading() { $('loading').classList.add('hide'); }
function showStatus(t, type) { $('status').textContent = t; $('status').className = 'status show ' + type; }
function clearStatus() { $('status').className = 'status'; $('status').textContent = ''; }
function msg(e) { return e && e.message ? e.message : String(e); }
function signed(v) { const n = Number(v); return n > 0 ? '+' + num(n) : num(n); }
function num(v) {
  const n = Number(v);
  if (!Number.isFinite(n)) return '0';
  return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
}
function round2(n) { return Math.round(Number(n) * 100) / 100; }
function esc(v) {
  return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
</script>
</body>
</html>
